<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login · Budget App</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
        body {
            background: #eef2f7;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        .card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 15px 25px -8px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 420px;
            padding: 1.8rem 2rem;
        }
        h1 { font-size: 1.5rem; color: #1e293b; margin-bottom: 0.2rem; }
        .subhead { color: #64748b; font-size: 0.85rem; margin-bottom: 1.5rem; border-bottom: 1px solid #e9eef3; padding-bottom: 0.6rem; }
        .form-group { margin-bottom: 1rem; }
        label { display: block; font-size: 0.8rem; font-weight: 500; color: #334155; margin-bottom: 0.3rem; }
        input {
            width: 100%;
            padding: 0.65rem 0.9rem;
            border: 1.5px solid #e2e8f0;
            border-radius: 12px;
            font-size: 0.9rem;
            outline: none;
            transition: 0.15s;
        }
        input:focus { border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.12); }
        .btn {
            background: #1e293b;
            color: white;
            font-weight: 500;
            font-size: 0.95rem;
            padding: 0.7rem 1.2rem;
            border: none;
            border-radius: 30px;
            width: 100%;
            cursor: pointer;
            margin-top: 0.5rem;
        }
        .btn:hover { background: #0f172a; }
        .message {
            margin-top: 0.9rem;
            padding: 0.6rem 0.8rem;
            border-radius: 12px;
            font-size: 0.85rem;
            text-align: center;
            display: none;
        }
        .message.error { background: #fee2e2; color: #b91c1c; display: block; }
        .message.success { background: #dcfce7; color: #166534; display: block; }
        .small-link { text-align: center; margin-top: 1.1rem; font-size: 0.85rem; color: #475569; }
        .small-link a { color: #1e293b; font-weight: 500; text-decoration: none; border-bottom: 1px dashed #94a3b8; cursor: pointer; }
        .small-link a:hover { border-bottom: 1px solid #1e293b; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Welcome back</h1>
        <div class="subhead">Sign in to your budget account</div>

        <div class="form-group">
            <label for="loginEmail">Email</label>
            <input type="email" id="loginEmail" placeholder="you@example.com" autocomplete="email">
        </div>
        <div class="form-group">
            <label for="loginPassword">Password</label>
            <input type="password" id="loginPassword" placeholder="••••••••" autocomplete="current-password">
        </div>
        <button class="btn" onclick="loginUser()">Log in</button>
        <div id="loginMessage" class="message"></div>

        <div class="small-link">
            Don't have an account? <a href="register.html">Create one</a>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
